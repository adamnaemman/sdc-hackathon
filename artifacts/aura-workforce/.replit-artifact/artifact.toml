kind = "web"
previewPath = "/"
title = "AURA-Workforce"
description = "A privacy-first workforce transition planner that helps employees and career counselors compare future roles, understand skill gaps, and follow evidence-linked upskilling pathways."
version = "1.0.0"
id = "artifacts/aura-workforce"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20531

[services.development]
run = "pnpm --filter @workspace/aura-workforce run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/aura-workforce", "run", "build" ]
serve = "static"
publicDir = "artifacts/aura-workforce/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20531"
BASE_PATH = "/"
